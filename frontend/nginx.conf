server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPAのフォールバック: 全ての未マッチパスを index.html へ
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静的アセットのキャッシュ設定
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
