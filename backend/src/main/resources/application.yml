spring:
  application:
    name: beat-seeker-backend

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    # 本番 URL / ユーザー / パスワードは環境変数で渡す。
    # ローカル開発時のみフォールバックとして localhost を使う (本番に紛れ込まないよう機密値は持たせない)。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beatseeker}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      initialization-fail-timeout: -1
      connection-init-sql: SET statement_timeout = '30s'

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}
  # 大きめの JSON 応答を gzip する。外部連携の一括 API
  # （GET /api/external/v1/score-summaries は非圧縮で約 470KB）の転送量対策。
  # min-response-size 未満は圧縮しないので、通常の小さな API 応答は影響を受けない。
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,text/html,application/javascript
    min-response-size: 2KB



# CORS: allow frontend dev server
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  league:
    # シーズン開始日（JST）。この日以降の月曜 15:00 から自動編成・開始する（それ以前の自動開始は待つ）。
    season-start: ${LEAGUE_SEASON_START:2026-08-03}
    # 参加受付の締切（JST・ISO 日時）。この時刻 〜 シーズン開始（月曜 15:00）の間は参加/離脱をロックし、
    # 管理者が本番と同じ編成（グループ・課題曲）を事前確認できるようにする。締切より前と開始後は通常どおり。
    signup-close: ${LEAGUE_SIGNUP_CLOSE:2026-08-02T23:59:00}

vapid:
  # 公開鍵はブラウザに配布されるため非機密。秘密鍵は環境変数で渡す（リポジトリにコミットしない）。
  # ※ 旧鍵は Git 履歴に残り漏洩済み。tools/generate_vapid.js で再生成し、公開鍵(と frontend 側)も差し替えること。
  public:
    key: ${VAPID_PUBLIC_KEY:BK8nOI89kHqMXjG1Pz5MiOLMc7lX8zjgd-gd3KhfRfr3mD_pt_VgRBFPzPRvmPoDhz06o82fBbBmVLATrotGB0k}
  private:
    key: ${VAPID_PRIVATE_KEY:}
  subject: mailto:admin@example.com

kofi:
  verification:
    token: ${KOFI_VERIFICATION_TOKEN:}

# リザルト画像の保存先（Cloudflare R2 / S3 互換オブジェクトストレージ）。
# 画像本体は R2 に置き、DB にはオブジェクトキーとメタ情報のみを保存する（DB 肥大化を回避）。
# 機密値（access-key / secret-key）はリポジトリにコミットせず、本番は Render の環境変数で渡すこと。
# 未設定（endpoint 等が空）の場合、リザルト画像 API は 503 を返し、他機能には影響しない。
storage:
  r2:
    # 例: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:beat-seeker-results}
    # R2 は署名用リージョンに "auto" を使う（S3 を使う場合は us-east-1 等の実リージョン）。
    region: ${R2_REGION:auto}
    # 一覧取得時に発行する署名付き GET URL の有効秒数（既定 1 時間）。
    presign-expiry-seconds: ${R2_PRESIGN_EXPIRY:3600}

# 管理者判定用の設定（Role テーブル未導入のため、ユーザー ID と IIDX ID で判定している）
# いずれかに一致したユーザーを管理者として扱う。
admin:
  user-id: ${ADMIN_USER_ID:18}
  iidx-id: ${ADMIN_IIDX_ID:5787-1145}
