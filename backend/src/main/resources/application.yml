spring:
  application:
    name: beat-seeker-backend

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  datasource:
    # 本番 URL / ユーザー / パスワードは環境変数で渡す。
    # ローカル開発時のみフォールバックとして localhost を使う (本番に紛れ込まないよう機密値は持たせない)。
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/beatseeker}
    driver-class-name: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 10
      initialization-fail-timeout: -1
      connection-init-sql: SET statement_timeout = '30s'

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}
  # 大きめの JSON 応答を gzip する。外部連携の一括 API
  # （GET /api/external/v1/score-summaries は非圧縮で約 470KB）の転送量対策。
  # min-response-size 未満は圧縮しないので、通常の小さな API 応答は影響を受けない。
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/css,text/html,application/javascript
    min-response-size: 2KB



# ログレベル。
# 本番 (Render) は INFO。web / security を DEBUG にすると全リクエストごとに
# 大量のログ文字列を生成することになり、GC 負荷が無視できない。
# ローカル開発で詳細ログが要る場合は application-local.yml 側で DEBUG に上書きする。
logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  league:
    # シーズン開始日（JST）。この日以降の月曜 12:00 から自動編成・開始する（それ以前の自動開始は待つ）。
    # 2026-08-03 週がプレシーズン、2026-08-10 週から通し番号付きの開催回 #1 が始まる。
    season-start: ${LEAGUE_SEASON_START:2026-08-03}
    # 開催回 #1 の開始日（JST）。この日以降に始まる週へ #1, #2, ... と連番で採番する。
    # これより前に始まった週（プレシーズン）は番号なしで「プレシーズン」と表示する。
    week-one-start: ${LEAGUE_WEEK_ONE_START:2026-08-10}
    # 参加受付は毎週「月曜 0:00 〜 開始(12:00)」の間だけロックする（LeagueService.isRegistrationLocked）。
    # この 12 時間で自動事前編成 → 管理者確認 → 開始、の順に進む。設定値は持たない（曜日・時刻固定）。
    #
    # ── ZINRAI 世代切り替えの一時措置（2026-09-21 の #6 から「しばらくの間」。終わったら false に戻す）──
    # 課題曲選定の自己ベストに過去作（past_scores）を含める。稼働直後は現行作のスコアが空で
    # 全曲「全員未プレー」扱いになり、実力に合った選曲ができないため（LeagueSongDrawService）。
    self-best-includes-past: ${LEAGUE_SELF_BEST_INCLUDES_PAST:true}
    # 有効ライン（週開始時点の自己ベスト）にも過去作（past_scores）を含める。稼働直後は現行作の
    # 記録が無く全曲ライン無しになるため、歴代ベスト超えを有効条件にする（LeagueWeekLifecycleService）。
    # プレビューと実ラインを一致させるため self-best-includes-past と同じ値にすること。
    baseline-includes-past: ${LEAGUE_BASELINE_INCLUDES_PAST:true}
    # 過去作スコアが 1 件も無いユーザーの新規参加を受け付けない（ラインの基準を持てないため）。
    # 過去作アーカイブ（version_pt_snapshots）が空の間＝世代切り替え前は判定せず、誰でも参加できる。
    # 2026-09-14 に解除（false）: 新規参加は誰でも受け付ける。再び止める場合は true にする。
    require-past-scores-to-join: ${LEAGUE_REQUIRE_PAST_SCORES_TO_JOIN:false}
  # ── 世代切り替え（IIDX 33 Sparkle Shower → 34 ZINRAI）──
  # launch-at を過ぎると (1) IidxVersions.current() が 34 を返し始め、(2) VersionTransitionScheduler が
  # スナップショット → past_scores 複製 → スコア初期化 を 1 度だけ自動実行する（1 分ポーリング）。
  # 手順と当日の確認項目は docs/ZINRAI移行当日スケジュール.md。
  version-transition:
    # 切替日時（JST、書式 2026-09-16T07:00）。空にすると自動実行は無効（現行作の切替日時はコード既定値）。
    launch-at: ${APP_VERSION_TRANSITION_LAUNCH_AT:2026-09-16T07:00}
    # true なら件数をログに出すだけで DB を変更しない（実行記録も残さない）。止めたいときは env で true にする。
    dry-run: ${APP_VERSION_TRANSITION_DRY_RUN:false}
    from-version: 33
    to-version: 34
    # スナップショット対象がこの人数に満たなければ中断（取り違え・空撃ち防止）。
    min-users: ${APP_VERSION_TRANSITION_MIN_USERS:100}
    # 手順 3: scores / user_song_ranks の全削除・users の PT リセット・全員へ 0PT 履歴行。
    reset-scores: ${APP_VERSION_TRANSITION_RESET_SCORES:true}
    # 難易度表 draft の自動適用。ZINRAI では管理画面から手動適用するので false。
    apply-difficulty: ${APP_VERSION_TRANSITION_APPLY_DIFFICULTY:false}
    # 前作データ判定（controller/StaleUploadGuard）: 切替前の最終プレー日時でスコアのある譜面がこの数以上、
    # かつ切替以降にプレーした譜面が 0 件なら、現行作の取り込み（POST /api/scores/upload）を 400 で拒否する。
    # 稼働初日に前作の CSV / 前作ページのブックマークレットで 3 件の汚染が起きたための防止策。
    stale-upload-min-scored: ${APP_VERSION_TRANSITION_STALE_UPLOAD_MIN_SCORED:5}
  # ── bemaniwiki 新曲リストの自動取り込み（WikiSongSyncService）──
  # 「beatmania IIDX 34 ZINRAI/新曲リスト」を定期的に取得し、SP の B/N/H/A/L のレベル・ノーツ数と
  # GENRE/TITLE/ARTIST/BPM を公開中（active）の楽曲マスタへ直接反映する（draft は経由しない）。
  # 未解禁（灰色表記）・レベルやノーツ数が未記載・"?" 付き・配信前セクションの譜面は保留し、埋まり次第取り込む。
  # 管理画面「ゲームデータ管理 → 楽曲追加」の「bemaniwiki 新曲同期」から手動実行・差分確認・履歴確認ができる。
  wiki-song-sync:
    # 定期実行の有効/無効（app.scheduling.enabled=false のときも止まる）。
    enabled: ${WIKI_SONG_SYNC_ENABLED:true}
    # 実行時刻（JST の Spring cron: 秒 分 時 日 月 曜日）。既定は 0:20 / 6:20 / 12:20 / 18:20 の 1 日 4 回。
    cron: "${WIKI_SONG_SYNC_CRON:0 20 0,6,12,18 * * *}"
    # 取得するページ。次回作に切り替えるときはここを差し替える。
    url: "${WIKI_SONG_SYNC_URL:https://bemaniwiki.com/?beatmania+IIDX+34+ZINRAI/%E6%96%B0%E6%9B%B2%E3%83%AA%E3%82%B9%E3%83%88}"
    # false にすると定期実行は差分の記録だけで DB を変更しない（手動実行はこの設定に関係なく反映する）。新曲・旧曲で共通。
    auto-apply: ${WIKI_SONG_SYNC_AUTO_APPLY:true}
    # ── 旧曲リスト（レベル表）+ 旧曲総ノーツ数リスト（総ノーツ数表）──
    # レベル変更・ノーツ数の訂正・旧曲への譜面追加（LEGGENDARIA など）・復活曲を取り込む。ルールは新曲リストと同じ。
    # 2 ページで 4MB 強あり変更も少ないので、既定は 1 日 1 回（5:40）。
    old-songs:
      enabled: ${WIKI_OLD_SONG_SYNC_ENABLED:true}
      cron: "${WIKI_OLD_SONG_SYNC_CRON:0 40 5 * * *}"
      # 次回作に切り替えるときは 2 つとも差し替える。
      list-url: "${WIKI_OLD_SONG_SYNC_LIST_URL:https://bemaniwiki.com/?beatmania+IIDX+34+ZINRAI/%E6%97%A7%E6%9B%B2%E3%83%AA%E3%82%B9%E3%83%88}"
      notes-url: "${WIKI_OLD_SONG_SYNC_NOTES_URL:https://bemaniwiki.com/?beatmania+IIDX+34+ZINRAI/%E6%97%A7%E6%9B%B2%E7%B7%8F%E3%83%8E%E3%83%BC%E3%83%84%E6%95%B0%E3%83%AA%E3%82%B9%E3%83%88}"
      # 定期実行 1 回で変更のかかる曲数がこれを超えたら反映を見送り、NEEDS_REVIEW として記録・通知する
      # （表構成の変化などで全曲を書き換えてしまう事故の歯止め。0 で無制限）。手動の「今すぐ同期」は制限なし。
      max-auto-songs: ${WIKI_OLD_SONG_SYNC_MAX_AUTO_SONGS:30}

vapid:
  # ブラウザ通知（Web Push）の鍵ペア。tools/generate_vapid.js で生成し、両方とも環境変数で渡す。
  # 公開鍵はブラウザに配布されるため非機密だが、秘密鍵は絶対にコミットしない。
  #
  # 既定値を空にしているのは、片方だけ設定した状態を「気付ける失敗」にするため。
  # ここに公開鍵をハードコードしておくと、秘密鍵だけ差し替えたときに鍵ペアが食い違い、
  # 送信が毎回 403 で黙って捨てられる（＝通知が来ない原因が分からない）状態になる。
  # 両方空なら起動ログに ERROR が出て、GET /api/notifications/push-status も false を返す。
  public:
    key: ${VAPID_PUBLIC_KEY:}
  private:
    key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:admin@example.com}

kofi:
  verification:
    token: ${KOFI_VERIFICATION_TOKEN:}

# リザルト画像の保存先（Cloudflare R2 / S3 互換オブジェクトストレージ）。
# 画像本体は R2 に置き、DB にはオブジェクトキーとメタ情報のみを保存する（DB 肥大化を回避）。
# 機密値（access-key / secret-key）はリポジトリにコミットせず、本番は Render の環境変数で渡すこと。
# 未設定（endpoint 等が空）の場合、リザルト画像 API は 503 を返し、他機能には影響しない。
storage:
  r2:
    # 例: https://<ACCOUNT_ID>.r2.cloudflarestorage.com
    endpoint: ${R2_ENDPOINT:}
    access-key: ${R2_ACCESS_KEY:}
    secret-key: ${R2_SECRET_KEY:}
    bucket: ${R2_BUCKET:beat-seeker-results}
    # R2 は署名用リージョンに "auto" を使う（S3 を使う場合は us-east-1 等の実リージョン）。
    region: ${R2_REGION:auto}
    # 一覧取得時に発行する署名付き GET URL の有効秒数（既定 1 時間）。
    presign-expiry-seconds: ${R2_PRESIGN_EXPIRY:3600}

# 管理者判定用の設定（Role テーブル未導入のため、ユーザー ID と IIDX ID で判定している）
# いずれかに一致したユーザーを管理者として扱う。
admin:
  user-id: ${ADMIN_USER_ID:18}
  iidx-id: ${ADMIN_IIDX_ID:5787-1145}
